# vim:set ft=tmux:
# Editor-style tab bar in the look of the asiimov preview:
#   row 0: session block + tab names (tab bar on a raised surface)
#   row 1: pane color, with an orange band under the active tab, so it
#          gets a thick orange underline
# Row 1 mirrors row 0's widths by replacing each character of the names with
# spaces or band glyphs (#{s/./x/:...}), so the two rows stay aligned.
# Sourced after catppuccin/tpm (they rewrite these options), and again from the
# client-*-theme hooks. Formats reference @thm_* lazily so colors follow the palette.

set -g status 2
set -gF status-style "bg=#{@thm_surface_0},fg=#{@thm_overlay_2}"
set -g status-justify left
set -g window-status-separator ""

# Tab label; row 1 reuses the same expression so widths match.
set -g @tab_label "#{window_name}#{?window_zoomed_flag, +,}"

set -g window-status-format \
  "#[fg=#{@thm_overlay_2}]   #{E:@tab_label}   "
set -g window-status-current-format \
  "#[bg=#{@thm_bg},fg=#{@thm_fg},bold]   #{E:@tab_label}   #[default]"

set -g status-left \
  "#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bold]  #S  #[default] "
set -g status-right ""

# Row 1: pane color, so the tab bar is row 0 only (a bar edge drawn partway
# into row 1 leaves notches: ghostty paints window padding per row with the
# edge cell's background). Under the active tab sits an orange band in the
# top eighth (▔), as a thick underline right under the bar.
set -g status-format[1] \
  "#[bg=#{@thm_bg},fill=#{@thm_bg}]     #{s/./ /:session_name}#{W:      #{s/./ /:#{E:@tab_label}},#[fg=#{@thm_blue}]▔▔▔▔▔▔#{s/./▔/:#{E:@tab_label}}}"
