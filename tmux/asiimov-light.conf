# vim:set ft=tmux:
# Asiimov (light) palette mapped onto catppuccin's @thm_* variable names.
# Source: https://github.com/jnigri/asiimov-theme (light flavor).
# Sourced before catppuccin.tmux (which sets these with -ogq), and again
# from the client-*-theme hooks when macOS switches appearance.

set -g @thm_bg "#eef0f1"
set -g @thm_fg "#161616"

# Accents: theme only has orange/green/red, so hues collapse onto those.
set -g @thm_rosewater "#d14f10"
set -g @thm_flamingo "#d14f10"
set -g @thm_pink "#b33a00"
set -g @thm_mauve "#e85400"
set -g @thm_red "#c8102e"
set -g @thm_maroon "#e0314d"
set -g @thm_peach "#b33a00"
set -g @thm_yellow "#a86400"
set -g @thm_green "#23803f"
set -g @thm_teal "#23803f"
set -g @thm_sky "#4d5357"
set -g @thm_sapphire "#4d5357"
set -g @thm_blue "#e85400"
set -g @thm_lavender "#e85400"

# Surfaces and overlays
set -g @thm_subtext_1 "#3a3e42"
set -g @thm_subtext_0 "#50555a"
set -g @thm_overlay_2 "#6c7176"
set -g @thm_overlay_1 "#868b90"
set -g @thm_overlay_0 "#a3a8ac"
set -g @thm_surface_2 "#bcc1c5"
set -g @thm_surface_1 "#ccd1d4"
set -g @thm_surface_0 "#e1e4e6"
set -g @thm_mantle "#e4e7e8"
set -g @thm_crust "#d8dcde"
