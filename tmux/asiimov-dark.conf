# vim:set ft=tmux:
# Asiimov Dark palette mapped onto catppuccin's @thm_* variable names.
# Source: https://github.com/jnigri/asiimov-theme (dark flavor).
# Sourced before catppuccin.tmux (which sets these with -ogq), and again
# from the client-*-theme hooks when macOS switches appearance.

set -g @thm_bg "#141516"
set -g @thm_fg "#e6e8e9"

# Accents: theme only has orange/green/red, so hues collapse onto those.
set -g @thm_rosewater "#ffab73"
set -g @thm_flamingo "#ffab73"
set -g @thm_pink "#ff8a3d"
set -g @thm_mauve "#ff5a00"
set -g @thm_red "#ff4d6a"
set -g @thm_maroon "#ff7a90"
set -g @thm_peach "#ff8a3d"
set -g @thm_yellow "#ffb547"
set -g @thm_green "#5fcf7d"
set -g @thm_teal "#5fcf7d"
set -g @thm_sky "#b8bec2"
set -g @thm_sapphire "#b8bec2"
set -g @thm_blue "#ff5a00"
set -g @thm_lavender "#ff5a00"

# Surfaces and overlays
set -g @thm_subtext_1 "#c7cbce"
set -g @thm_subtext_0 "#a9aeb2"
set -g @thm_overlay_2 "#8a8f93"
set -g @thm_overlay_1 "#6b7074"
set -g @thm_overlay_0 "#4f5357"
set -g @thm_surface_2 "#3a3d40"
set -g @thm_surface_1 "#2c2f31"
set -g @thm_surface_0 "#1d1f20"
set -g @thm_mantle "#101112"
set -g @thm_crust "#0b0c0c"
